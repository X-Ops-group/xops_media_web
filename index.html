    <!-- Google tag (gtag.js) — dos propiedades: X-Ops Media propia (G-2NNRK7STRW) +
         X-Ops Conference (G-0J9VPTTHQT), para que el tráfico de esta web también
         cuente en el dashboard de la conferencia. Un solo loader, dos configs. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2NNRK7STRW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-2NNRK7STRW');
      gtag('config', 'G-0J9VPTTHQT');
    </script>

    <!-- Google AdSense (Auto ads: coloca anuncios automáticamente en toda la página
         con solo este script; no requiere data-ad-slot por unidad. Los AdSlot
         manuales de la app se activan aparte si se configuran los slot IDs,
         ver src/components/AdSlot.tsx) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5525157068767516"
     crossorigin="anonymous"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
